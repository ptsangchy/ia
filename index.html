<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Lora:wght@400;600&display=swap"
    />
    <style>
      :root {
        --bg: #eceff4;
        --panel: #fff;
        --ink: #1b2333;
        --mute: #59647a;
        --line: #c9d1de;
        --accent: #2d49d1;
        --accent-ink: #fff;
        --ok: #16794a;
        --okbg: #ddf3e7;
        --bad: #c0352b;
        --badbg: #fbe4e1;
        --show: #8a5a00;
        --showbg: #fcefd0;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #10141c;
          --panel: #1a2030;
          --ink: #e7ebf4;
          --mute: #9aa6bd;
          --line: #323b50;
          --accent: #7b93ff;
          --accent-ink: #0d1220;
          --ok: #5fd394;
          --okbg: #17372a;
          --bad: #ff8a7e;
          --badbg: #3d1d1a;
          --show: #f0c36a;
          --showbg: #3a2d10;
        }
      }
      :root[data-theme="dark"] {
        --bg: #10141c;
        --panel: #1a2030;
        --ink: #e7ebf4;
        --mute: #9aa6bd;
        --line: #323b50;
        --accent: #7b93ff;
        --accent-ink: #0d1220;
        --ok: #5fd394;
        --okbg: #17372a;
        --bad: #ff8a7e;
        --badbg: #3d1d1a;
        --show: #f0c36a;
        --showbg: #3a2d10;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          400 16px/1.5 "Be Vietnam Pro",
          system-ui,
          sans-serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 8px 0 4px;
        font-weight: 700;
      }
      .sub {
        color: var(--mute);
        margin: 0 0 20px;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }
      label.t {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      textarea {
        width: 100%;
        min-height: 130px;
        resize: vertical;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--ink);
        font:
          400 1rem/1.6 "Lora",
          serif;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        align-items: center;
        margin-top: 14px;
      }
      .slider {
        flex: 1 1 280px;
      }
      .slider b {
        font-variant-numeric: tabular-nums;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }
      .ticks {
        display: flex;
        justify-content: space-between;
        color: var(--mute);
        font-size: 0.8rem;
      }
      button {
        font:
          600 0.95rem "Be Vietnam Pro",
          sans-serif;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        padding: 9px 14px;
        border-radius: 6px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
      }
      .score {
        margin-left: auto;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .prog {
        height: 6px;
        background: var(--line);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 18px;
      }
      .prog i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--ok);
        transition: width 0.2s;
      }
      #text {
        font:
          400 1.25rem/2.4 "Lora",
          serif;
      }
      .line {
        min-height: 1em;
      }
      .gap {
        height: 0.9em;
      }
      #text input {
        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 0;
        border-bottom: 2px solid var(--accent);
        border-radius: 0;
        padding: 0 2px;
        margin: 0 1px;
        text-align: center;
        min-width: 2.2ch;
      }
      #text input:focus {
        outline: none;
        background: var(--okbg);
        border-bottom-color: var(--ink);
      }
      #text input.ok {
        color: var(--ok);
        border-bottom-color: var(--ok);
        background: var(--okbg);
      }
      #text input.bad {
        color: var(--bad);
        border-bottom-color: var(--bad);
        background: var(--badbg);
      }
      #text input.show {
        color: var(--show);
        border-bottom-color: var(--show);
        background: var(--showbg);
      }
      .empty {
        color: var(--mute);
      }
      @media (prefers-reduced-motion: reduce) {
        .prog i {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Học thuộc bằng cách điền từ</h1>
      <p class="sub"
        >Dán đoạn văn, chọn tỉ lệ từ bị ẩn, rồi gõ lại các từ còn thiếu.</p
      >

      <section>
        <label class="t" for="src">Đoạn văn cần học</label>
        <textarea id="src" spellcheck="false"></textarea>
        <div class="row">
          <div class="slider">
            <label for="pct"
              >Mức ẩn từ: <b id="pctLabel">50%</b>
              <span id="cntLabel" class="empty"></span
            ></label>
            <input
              type="range"
              id="pct"
              min="30"
              max="80"
              step="5"
              value="50"
            />
            <div class="ticks"><span>30% – dễ</span><span>80% – khó</span></div>
          </div>
          <label
            ><input type="checkbox" id="noAccent" /> Bỏ qua dấu tiếng
            Việt</label
          >
        </div>
        <div class="row"
          ><button class="primary" id="start">Bắt đầu học</button></div
        >
      </section>

      <section id="practice" hidden>
        <div class="bar">
          <button id="check">Kiểm tra</button>
          <button id="hint">Gợi ý chữ cái đầu</button>
          <button id="reshuffle">Ẩn từ khác</button>
          <button id="reveal">Hiện đáp án</button>
          <span class="score" id="score" aria-live="polite"></span>
        </div>
        <div class="prog" aria-hidden="true"><i id="prog"></i></div>
        <div id="text"></div>
      </section>
    </main>

    <script>
      (function () {
        var SAMPLE =
          "Nam quốc sơn hà Nam đế cư\nTiệt nhiên định phận tại thiên thư\nNhư hà nghịch lỗ lai xâm phạm\nNhữ đẳng hành khan thủ bại hư";
        var $ = function (s) {
          return document.querySelector(s);
        };
        var src = $("#src"),
          pct = $("#pct"),
          started = false,
          seed = 7,
          inputs = [],
          lines = [];
        try {
          var saved = localStorage.getItem("hoc-thuoc-text");
          src.value = saved || SAMPLE;
        } catch (e) {
          src.value = SAMPLE;
        }

        var WORD = /[\p{L}\p{N}]/u;
        function parse(text) {
          return text
            .replace(/\r/g, "")
            .split("\n")
            .map(function (line) {
              return line
                .split(/\s+/)
                .filter(Boolean)
                .map(function (t) {
                  var m = t.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
                  return {
                    pre: m[1],
                    core: m[2],
                    post: m[3],
                    word: WORD.test(m[2]),
                  };
                });
            });
        }
        function rng(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        function norm(s) {
          s = s.trim().toLowerCase();
          if ($("#noAccent").checked)
            return s
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .replace(/đ/g, "d");
          return s.normalize("NFC");
        }
        function wordCount() {
          var n = 0;
          parse(src.value).forEach(function (l) {
            l.forEach(function (t) {
              if (t.word) n++;
            });
          });
          return n;
        }
        function updateLabels() {
          var p = +pct.value,
            n = wordCount();
          $("#pctLabel").textContent = p + "%";
          $("#cntLabel").textContent = n
            ? "(ẩn " + Math.max(1, Math.round((n * p) / 100)) + "/" + n + " từ)"
            : "";
        }
        function build() {
          var data = parse(src.value),
            all = [];
          data.forEach(function (l, i) {
            l.forEach(function (t, j) {
              if (t.word) all.push([i, j]);
            });
          });
          var box = $("#text");
          box.innerHTML = "";
          inputs = [];
          if (!all.length) {
            box.innerHTML =
              '<p class="empty">Chưa có từ nào để học. Hãy dán một đoạn văn ở trên.</p>';
            updateScore();
            return;
          }
          var r = rng(seed),
            order = all.map(function (_, i) {
              return i;
            });
          for (var i = order.length - 1; i > 0; i--) {
            var j = Math.floor(r() * (i + 1));
            var tmp = order[i];
            order[i] = order[j];
            order[j] = tmp;
          }
          var k = Math.max(1, Math.round((all.length * +pct.value) / 100)),
            hide = {};
          order.slice(0, k).forEach(function (o) {
            hide[all[o][0] + "_" + all[o][1]] = 1;
          });
          data.forEach(function (line, i) {
            var div = document.createElement("div");
            div.className = line.length ? "line" : "gap";
            line.forEach(function (t, j) {
              div.appendChild(document.createTextNode(t.pre));
              if (hide[i + "_" + j]) {
                var inp = document.createElement("input");
                inp.type = "text";
                inp.autocomplete = "off";
                inp.spellcheck = false;
                inp.autocapitalize = "off";
                inp.dataset.ans = t.core;
                inp.style.width = t.core.length + 1.5 + "ch";
                inp.setAttribute(
                  "aria-label",
                  "Từ thứ " +
                    (inputs.length + 1) +
                    " gồm " +
                    t.core.length +
                    " ký tự",
                );
                inp.addEventListener("input", function () {
                  tryMatch(inp, true);
                });
                inp.addEventListener("keydown", function (e) {
                  if (e.key === "Enter") {
                    e.preventDefault();
                    nextBlank(inp);
                  }
                });
                inputs.push(inp);
                div.appendChild(inp);
              } else div.appendChild(document.createTextNode(t.core));
              div.appendChild(document.createTextNode(t.post + " "));
            });
            box.appendChild(div);
          });
          updateScore();
        }
        function tryMatch(inp, live) {
          if (inp.classList.contains("ok") || inp.classList.contains("show"))
            return;
          inp.classList.remove("bad");
          if (norm(inp.value) === norm(inp.dataset.ans)) {
            inp.value = inp.dataset.ans;
            inp.readOnly = true;
            inp.classList.add("ok");
            if (live) nextBlank(inp);
          }
          updateScore();
        }
        function open() {
          return inputs.filter(function (i) {
            return !i.classList.contains("ok") && !i.classList.contains("show");
          });
        }
        function nextBlank(from) {
          var idx = inputs.indexOf(from);
          for (var d = 1; d <= inputs.length; d++) {
            var c = inputs[(idx + d) % inputs.length];
            if (c !== from && !c.readOnly) {
              c.focus();
              return;
            }
          }
        }
        function updateScore() {
          var total = inputs.length,
            ok = inputs.filter(function (i) {
              return i.classList.contains("ok");
            }).length;
          $("#score").textContent = total ? "Đúng " + ok + "/" + total : "";
          $("#prog").style.width = total ? (ok / total) * 100 + "%" : "0";
          if (total && ok === total)
            $("#score").textContent = "Hoàn thành " + ok + "/" + total + " ✓";
        }
        function begin() {
          try {
            localStorage.setItem("hoc-thuoc-text", src.value);
          } catch (e) {}
          started = true;
          seed = Math.floor(Math.random() * 1e9);
          $("#practice").hidden = false;
          build();
          var f = open()[0];
          if (f) f.focus();
          $("#practice").scrollIntoView({ behavior: "smooth", block: "start" });
        }
        $("#start").addEventListener("click", begin);
        $("#reshuffle").addEventListener("click", function () {
          seed = Math.floor(Math.random() * 1e9);
          build();
          var f = open()[0];
          if (f) f.focus();
        });
        $("#check").addEventListener("click", function () {
          open().forEach(function (i) {
            if (norm(i.value) === norm(i.dataset.ans)) {
              tryMatch(i, false);
            } else i.classList.add("bad");
          });
          updateScore();
        });
        $("#hint").addEventListener("click", function () {
          var t =
            document.activeElement &&
            inputs.indexOf(document.activeElement) > -1 &&
            !document.activeElement.readOnly
              ? document.activeElement
              : open()[0];
          if (!t) return;
          t.value = t.dataset.ans.charAt(0);
          t.classList.remove("bad");
          t.focus();
          t.setSelectionRange(t.value.length, t.value.length);
          tryMatch(t, false);
        });
        $("#reveal").addEventListener("click", function () {
          open().forEach(function (i) {
            i.value = i.dataset.ans;
            i.readOnly = true;
            i.classList.remove("bad");
            i.classList.add("show");
          });
          updateScore();
        });
        pct.addEventListener("input", function () {
          updateLabels();
          if (started) build();
        });
        src.addEventListener("input", updateLabels);
        $("#noAccent").addEventListener("change", function () {
          inputs.forEach(function (i) {
            tryMatch(i, false);
          });
        });
        updateLabels();
      })();
    </script>
  </body>
</html>
